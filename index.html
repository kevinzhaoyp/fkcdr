<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>吃豆人 · Pac-Man</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:16px;
    background:#05060f;
    background-image:
      radial-gradient(700px 420px at 50% -8%, rgba(60,90,220,.20), transparent 70%),
      radial-gradient(600px 400px at 10% 110%, rgba(220,60,120,.12), transparent 70%);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#e8eeff;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    touch-action:manipulation;
  }

  .hud{
    width:100%;max-width:494px;
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:0 4px;
  }
  .hud-item{display:flex;align-items:baseline;gap:7px;}
  .hud-item .lbl{
    font-size:11px;letter-spacing:1.4px;color:#7c8db5;
    text-transform:uppercase;font-weight:600;
  }
  .hud-item .val{
    font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;
    color:#ffd93b;letter-spacing:.4px;
  }
  .lives{display:flex;gap:5px;align-items:center;min-height:14px;}
  .life{
    width:13px;height:13px;border-radius:50%;
    background:linear-gradient(150deg,#fff27a,#ffcc00);
    box-shadow:0 0 8px rgba(255,214,0,.55);
    display:inline-block;
  }

  .stage{
    position:relative;
    border-radius:18px;
    padding:8px;
    background:linear-gradient(165deg,#111a3d,#0a0e24);
    box-shadow:
      0 0 0 1px rgba(90,130,255,.22),
      0 24px 60px -24px rgba(60,100,255,.5),
      inset 0 1px 0 rgba(255,255,255,.06);
    line-height:0;
  }
  #game{
    display:block;
    width:494px;max-width:100%;height:auto;
    border-radius:11px;
    background:#070a1a;
  }

  .overlay{
    position:absolute;inset:8px;
    border-radius:11px;
    background:rgba(6,9,26,.90);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;padding:26px;
    line-height:1.5;
    transition:opacity .22s ease, visibility .22s;
    z-index:5;
  }
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .overlay h2{
    font-size:27px;font-weight:800;letter-spacing:1px;
    background:linear-gradient(100deg,#ffe14d,#ffb02e,#ff7a59);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .overlay p{font-size:13.5px;color:#9aacd4;max-width:290px;}
  .overlay button{
    margin-top:6px;
    padding:11px 34px;border:none;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:14.5px;font-weight:700;letter-spacing:.8px;
    color:#1a1400;
    background:linear-gradient(160deg,#ffe14d,#ffb02e);
    box-shadow:0 8px 22px -8px rgba(255,190,0,.85), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .overlay button:hover{transform:translateY(-1px);box-shadow:0 12px 28px -8px rgba(255,190,0,.95), inset 0 1px 0 rgba(255,255,255,.6);}
  .overlay button:active{transform:translateY(1px);}

  .tips{
    font-size:12px;color:#5d6b90;letter-spacing:.4px;text-align:center;
    line-height:1.7;
  }
  .tips b{color:#8b9bc4;font-weight:600;}

  @media (max-width:560px){
    body{gap:10px;padding:10px;}
    .hud-item .val{font-size:16px;}
    .overlay h2{font-size:22px;}
    .overlay p{font-size:12.5px;}
    .tips{font-size:11px;}
  }
</style>
</head>
<body>

  <div class="hud">
    <div class="hud-item"><span class="lbl">得分</span><span class="val" id="score">0</span></div>
    <div class="hud-item"><span class="lbl">关卡</span><span class="val" id="level">1</span></div>
    <div class="hud-item"><span class="lbl">生命</span><span class="lives" id="lives"></span></div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">吃豆人</h2>
      <p id="ovText">吃掉所有豆子即可过关，小心幽灵！</p>
      <button id="ovBtn">开始游戏</button>
    </div>
  </div>

  <p class="tips">
    <b>方向键</b> 或 <b>WASD</b> 控制移动 · <b>空格</b> 暂停 · 手机可滑动屏幕 · 被撞后豆子会复原
  </p>

<script>
(function () {
  'use strict';

  /* ============================================================
     1. 地图
     ============================================================ */
  const RAW_MAP = [
    "###################",
    "#........#........#",
    "#o##.###.#.###.##o#",
    "#.................#",
    "#.##.#.#####.#.##.#",
    "#....#...#...#....#",
    "####.###.#.###.####",
    "   #.#.......#.#   ",
    "####.#.##-##.#.####",
    ".......#   #.......",
    "####.#.#####.#.####",
    "   #.#.......#.#   ",
    "####.#.#####.#.####",
    "#........#........#",
    "#.##.###.#.###.##.#",
    "#o.#.....#.....#.o#",
    "##.#.#.###.#.#.#.##",
    "#....#...#...#....#",
    "#.######.#.######.#",
    "#.................#",
    "###################"
  ];

  const COLS = 19;
  const ROWS = 21;
  const TILE = 26;
  const W = COLS * TILE;   // 494
  const H = ROWS * TILE;   // 546

  /* ============================================================
     ★ 速度参数（想再调快慢，改这几行即可）
     ============================================================ */
  const PAC_SPEED        = 6.8;   // 吃豆人速度（格/秒）
  const GHOST_SPEED_BASE = 3.6;   // 幽灵初始速度
  const GHOST_SPEED_STEP = 0.20;  // 每过一关幽灵加速量
  const GHOST_SPEED_MAX  = 5.2;   // 幽灵速度上限

  /* ============================================================
     2. 画布
     ============================================================ */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* ============================================================
     3. 全局状态
     ============================================================ */
  const GHOST_SPAWNS = [
    { c: 9,  r: 9, dir: { x: 0, y: -1 }, color: '#ff3b3b' }, // 红
    { c: 9,  r: 8, dir: { x: 0, y: -1 }, color: '#ff9ee0' }, // 粉
    { c: 8,  r: 9, dir: { x: 0, y: -1 }, color: '#43e0ff' }, // 青
    { c: 10, r: 9, dir: { x: 0, y: -1 }, color: '#ffb347' }  // 橙
  ];

  let grid = [];
  let initialGrid = [];
  let dotsLeft = 0;
  let score = 0;
  let lives = 3;
  let level = 1;
  let frightTimer = 0;
  let ghostCombo = 0;
  let gameState = 'ready';   // ready | playing | paused | dying | gameover | levelclear
  let stateTimer = 0;
  let animTime = 0;

  /* ---------- 吃豆人 ---------- */
  const pac = {
    col: 9, row: 19, prog: 0,
    dir:     { x: -1, y: 0 },
    nextDir: { x: -1, y: 0 },
    speed: PAC_SPEED,
    isGhost: false,
    get x() { return (this.col + this.dir.x * this.prog + 0.5) * TILE; },
    get y() { return (this.row + this.dir.y * this.prog + 0.5) * TILE; }
  };

  /* ---------- 幽灵 ---------- */
  const ghosts = GHOST_SPAWNS.map(function (s, i) {
    return {
      id: i,
      col: s.c, row: s.r, prog: 0,
      dir: { x: s.dir.x, y: s.dir.y },
      speed: GHOST_SPEED_BASE,
      isGhost: true,
      color: s.color,
      frightened: false,
      get x() { return (this.col + this.dir.x * this.prog + 0.5) * TILE; },
      get y() { return (this.row + this.dir.y * this.prog + 0.5) * TILE; }
    };
  });

  /* ============================================================
     4. 网格工具
     ============================================================ */
  function tileAt(c, r) {
    if (r < 0 || r >= ROWS) return '#';
    c = ((c % COLS) + COLS) % COLS;
    return grid[r][c];
  }

  function canMove(c, r) {
    return tileAt(c, r) !== '#';
  }

  function canGhostMove(c, r, allowDoor) {
    const t = tileAt(c, r);
    if (t === '#') return false;
    if (t === '-') return !!allowDoor;
    return true;
  }

  function isInHouse(g) {
    return (g.row === 9 && g.col >= 8 && g.col <= 10) ||
           (g.row === 8 && g.col === 9);
  }

  /* ============================================================
     5. 核心移动（网格 + 进度模型，帧率无关）
     ============================================================ */
  const DIRS = [
    { x: 0,  y: -1 },  // 上
    { x: -1, y: 0  },  // 左
    { x: 0,  y: 1  },  // 下
    { x: 1,  y: 0  }   // 右
  ];

  function stepEntity(e, dt, onCenter) {
    let remain = e.speed * dt;
    let guard = 0;

    while (remain > 1e-6 && guard++ < 80) {

      if (e.prog <= 1e-6) {
        onCenter(e);

        if (e.dir.x === 0 && e.dir.y === 0) return;

        const nc = e.col + e.dir.x;
        const nr = e.row + e.dir.y;
        const ok = e.isGhost
          ? canGhostMove(nc, nr, isInHouse(e))
          : canMove(nc, nr);

        if (!ok) {
          e.dir = { x: 0, y: 0 };
          return;
        }
      }

      const need = 1 - e.prog;
      if (remain >= need) {
        remain -= need;
        e.col += e.dir.x;
        e.row += e.dir.y;
        if (e.col < 0) e.col = COLS - 1;
        else if (e.col >= COLS) e.col = 0;
        e.prog = 0;
      } else {
        e.prog += remain;
        remain = 0;
      }
    }
  }

  function pacBrain(e) {
    const nc = e.col + e.nextDir.x;
    const nr = e.row + e.nextDir.y;
    if ((e.nextDir.x || e.nextDir.y) && canMove(nc, nr)) {
      e.dir = { x: e.nextDir.x, y: e.nextDir.y };
    }
  }

  function ghostBrain(g) {
    const inHouse = isInHouse(g);
    const opts = [];

    for (let i = 0; i < DIRS.length; i++) {
      const d = DIRS[i];
      if (d.x === -g.dir.x && d.y === -g.dir.y) continue;
      if (canGhostMove(g.col + d.x, g.row + d.y, inHouse)) opts.push(d);
    }

    if (opts.length === 0) {
      g.dir = { x: -g.dir.x, y: -g.dir.y };
      return;
    }

    if (g.frightened) {
      g.dir = opts[(Math.random() * opts.length) | 0];
      return;
    }

    const t = getGhostTarget(g);
    let best = opts[0];
    let bestDist = Infinity;
    for (let i = 0; i < opts.length; i++) {
      const d = opts[i];
      const nc = g.col + d.x;
      const nr = g.row + d.y;
      const dist = (nc - t.c) * (nc - t.c) + (nr - t.r) * (nr - t.r);
      if (dist < bestDist) { bestDist = dist; best = d; }
    }
    g.dir = best;
  }

  function getGhostTarget(g) {
    if (isInHouse(g)) return { c: 9, r: 7 };

    switch (g.id) {
      case 0:
        return { c: pac.col, r: pac.row };
      case 1:
        return { c: pac.col + pac.dir.x * 4, r: pac.row + pac.dir.y * 4 };
      case 2:
        return { c: pac.col - pac.dir.x * 4, r: pac.row - pac.dir.y * 4 };
      default: {
        const dx = g.col - pac.col;
        const dy = g.row - pac.row;
        return (dx * dx + dy * dy) > 64
          ? { c: pac.col, r: pac.row }
          : { c: 1, r: 19 };
      }
    }
  }

  /* ============================================================
     6. 游戏流程
     ============================================================ */
  function countDots() {
    let n = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = grid[r][c];
        if (t === '.' || t === 'o') n++;
      }
    }
    return n;
  }

  function buildGrid() {
    grid = RAW_MAP.map(function (row) { return row.split(''); });
    initialGrid = grid.map(function (row) { return row.slice(); });
    dotsLeft = countDots();
  }

  function restoreDots() {
    grid = initialGrid.map(function (row) { return row.slice(); });
    dotsLeft = countDots();
    updateHUD();
  }

  function resetPositions() {
    pac.col = 9; pac.row = 19; pac.prog = 0;
    pac.dir = { x: -1, y: 0 };
    pac.nextDir = { x: -1, y: 0 };

    for (let i = 0; i < ghosts.length; i++) {
      const g = ghosts[i];
      const s = GHOST_SPAWNS[i];
      g.col = s.c;
      g.row = s.r;
      g.prog = 0;
      g.dir = { x: s.dir.x, y: s.dir.y };
      g.frightened = false;
    }

    frightTimer = 0;
    ghostCombo = 0;
  }

  function startGame() {
    buildGrid();
    score = 0;
    lives = 3;
    level = 1;
    ghosts.forEach(function (g) { g.speed = GHOST_SPEED_BASE; });
    resetPositions();
    updateHUD();
    gameState = 'playing';
    hideOverlay();
  }

  function nextLevel() {
    level++;
    buildGrid();
    resetPositions();
    ghosts.forEach(function (g) {
      g.speed = Math.min(GHOST_SPEED_MAX, GHOST_SPEED_BASE + (level - 1) * GHOST_SPEED_STEP);
    });
    updateHUD();
    gameState = 'playing';
    hideOverlay();
  }

  function loseLife() {
    lives--;
    updateHUD();
    if (lives <= 0) {
      gameState = 'gameover';
      showOverlay('游戏结束', '最终得分：' + score + ' 分', '再来一局');
    } else {
      gameState = 'dying';
      stateTimer = 1.1;
    }
  }

  function frighten() {
    frightTimer = 7.5;
    ghostCombo = 0;
    ghosts.forEach(function (g) {
      if (!isInHouse(g)) g.frightened = true;
    });
  }

  function eatAt(px, py) {
    const c = Math.floor(px / TILE);
    const r = Math.floor(py / TILE);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;

    const t = grid[r][c];
    if (t === '.') {
      grid[r][c] = ' ';
      dotsLeft--;
      score += 10;
      updateHUD();
    } else if (t === 'o') {
      grid[r][c] = ' ';
      dotsLeft--;
      score += 50;
      frighten();
      updateHUD();
    }
  }

  /* ============================================================
     7. 每帧更新
     ============================================================ */
  function update(dt) {

    if (gameState === 'dying') {
      stateTimer -= dt;
      if (stateTimer <= 0) {
        resetPositions();
        restoreDots();      // 豆子复原
        gameState = 'playing';
      }
      return;
    }

    if (gameState !== 'playing') return;

    if (frightTimer > 0) {
      frightTimer -= dt;
      if (frightTimer <= 0) {
        frightTimer = 0;
        ghostCombo = 0;
        ghosts.forEach(function (g) { g.frightened = false; });
      }
    }

    stepEntity(pac, dt, pacBrain);
    for (let i = 0; i < ghosts.length; i++) {
      stepEntity(ghosts[i], dt, ghostBrain);
    }

    eatAt(pac.x, pac.y);

    const hitR = TILE * 0.62;
    for (let i = 0; i < ghosts.length; i++) {
      const g = ghosts[i];
      const dx = g.x - pac.x;
      const dy = g.y - pac.y;
      if (dx * dx + dy * dy < hitR * hitR) {

        if (g.frightened) {
          ghostCombo = Math.min(ghostCombo + 1, 4);
          score += 200 * Math.pow(2, ghostCombo - 1);
          updateHUD();

          g.col = 9; g.row = 9; g.prog = 0;
          g.dir = { x: 0, y: -1 };
          g.frightened = false;
        } else {
          loseLife();
          return;
        }
      }
    }

    if (dotsLeft <= 0) {
      gameState = 'levelclear';
      stateTimer = 1.3;
    }
  }

  /* ============================================================
     8. 渲染
     ============================================================ */
  let mazeCanvas = null;

  /* ---------- ★ 星空背景 ---------- */
  const STARS = (function () {
    const arr = [];
    for (let i = 0; i < 120; i++) {
      arr.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.4 + Math.random() * 1.4,        // 星星半径
        phase: Math.random() * Math.PI * 2,  // 闪烁相位
        speed: 0.5 + Math.random() * 1.8,    // 闪烁速度
        base: 0.20 + Math.random() * 0.55,   // 基础亮度
        warm: Math.random() < 0.22           // 少量暖色调星星
      });
    }
    return arr;
  })();

  function drawStars() {
    for (let i = 0; i < STARS.length; i++) {
      const s = STARS[i];
      const tw = 0.5 + 0.5 * Math.sin(animTime * s.speed + s.phase);
      const a = s.base * (0.35 + 0.65 * tw);
      if (a < 0.02) continue;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.warm
        ? 'rgba(255,236,190,' + a.toFixed(3) + ')'
        : 'rgba(200,220,255,' + a.toFixed(3) + ')';
      ctx.fill();
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function buildMazeCanvas() {
    mazeCanvas = document.createElement('canvas');
    mazeCanvas.width  = Math.round(W * dpr);
    mazeCanvas.height = Math.round(H * dpr);
    const m = mazeCanvas.getContext('2d');
    m.setTransform(dpr, 0, 0, dpr, 0, 0);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = RAW_MAP[r][c];
        const x = c * TILE;
        const y = r * TILE;

        if (t === '#') {
          m.fillStyle = '#16215a';
          roundRect(m, x + 1, y + 1, TILE - 2, TILE - 2, 6);
          m.fill();

          m.strokeStyle = 'rgba(86,130,255,.55)';
          m.lineWidth = 1.2;
          roundRect(m, x + 2.4, y + 2.4, TILE - 4.8, TILE - 4.8, 4.5);
          m.stroke();

        } else if (t === '-') {
          m.fillStyle = '#f8a5c8';
          m.shadowBlur = 8;
          m.shadowColor = '#ff7ab8';
          m.fillRect(x + 1, y + TILE / 2 - 2, TILE - 2, 4);
          m.shadowBlur = 0;
        }
      }
    }
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function drawDots() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = grid[r][c];
        if (t !== '.' && t !== 'o') continue;

        const cx = (c + 0.5) * TILE;
        const cy = (r + 0.5) * TILE;

        if (t === '.') {
          ctx.beginPath();
          ctx.arc(cx, cy, TILE * 0.1, 0, Math.PI * 2);
          ctx.fillStyle = '#ffe2b0';
          ctx.fill();
        } else {
          const pulse = 0.5 + 0.5 * Math.sin(animTime * 6);
          ctx.beginPath();
          ctx.arc(cx, cy, TILE * 0.19 + pulse * TILE * 0.07, 0, Math.PI * 2);
          ctx.fillStyle = '#fff2c4';
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#ffcf6b';
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
    }
  }

  function drawPac() {
    const x = pac.x;
    const y = pac.y;
    const r = TILE * 0.42;

    const d = (pac.nextDir.x || pac.nextDir.y) ? pac.nextDir : pac.dir;
    let ang = 0;
    if (d.x === 1) ang = 0;
    else if (d.x === -1) ang = Math.PI;
    else if (d.y === -1) ang = -Math.PI / 2;
    else if (d.y === 1) ang = Math.PI / 2;

    const moving = !(pac.dir.x === 0 && pac.dir.y === 0);
    const mouth = moving
      ? Math.abs(Math.sin(animTime * 12)) * 0.38
      : 0.22 + Math.abs(Math.sin(animTime * 3)) * 0.14;

    const glow = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 1.55);
    glow.addColorStop(0, 'rgba(255,222,60,.30)');
    glow.addColorStop(1, 'rgba(255,222,60,0)');
    ctx.beginPath();
    ctx.arc(x, y, r * 1.55, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, ang + mouth, ang + Math.PI * 2 - mouth);
    ctx.closePath();
    ctx.fillStyle = '#ffe600';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x - r * 0.22, y - r * 0.38, r * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.fill();
  }

  function drawGhost(g) {
    const x = g.x;
    const y = g.y;
    const r = TILE * 0.42;

    const blinking = g.frightened && frightTimer < 2.2 &&
                     Math.floor(frightTimer * 7) % 2 === 0;
    const bodyColor = g.frightened
      ? (blinking ? '#ffffff' : '#2f45ff')
      : g.color;

    const glow = ctx.createRadialGradient(x, y, r * 0.3, x, y, r * 1.4);
    glow.addColorStop(0, hexA(bodyColor, 0.3));
    glow.addColorStop(1, hexA(bodyColor, 0));
    ctx.beginPath();
    ctx.arc(x, y, r * 1.4, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y - r * 0.08, r, Math.PI, 0);
    ctx.lineTo(x + r, y + r * 0.72);

    const waves = 3;
    const step = (r * 2) / waves;
    for (let i = 0; i < waves; i++) {
      const x0 = x + r - i * step;
      const x1 = x0 - step;
      ctx.quadraticCurveTo((x0 + x1) / 2, y + r * 1.24, x1, y + r * 0.72);
    }
    ctx.closePath();
    ctx.fillStyle = bodyColor;
    ctx.fill();

    if (g.frightened) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x - r * 0.34, y - r * 0.12, r * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.34, y - r * 0.12, r * 0.16, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = Math.max(1.4, r * 0.12);
      ctx.beginPath();
      ctx.moveTo(x - r * 0.5, y + r * 0.36);
      for (let i = 0; i < 4; i++) {
        ctx.lineTo(x - r * 0.5 + (i + 0.5) * (r * 0.25), y + r * 0.2);
        ctx.lineTo(x - r * 0.5 + (i + 1) * (r * 0.25), y + r * 0.36);
      }
      ctx.stroke();
      return;
    }

    const ex = g.dir.x * r * 0.22;
    const ey = g.dir.y * r * 0.22;

    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x - r * 0.34, y - r * 0.14, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.34, y - r * 0.14, r * 0.28, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#101a52';
    ctx.beginPath(); ctx.arc(x - r * 0.34 + ex, y - r * 0.14 + ey, r * 0.145, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.34 + ex, y - r * 0.14 + ey, r * 0.145, 0, Math.PI * 2); ctx.fill();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#070a1a';
    ctx.fillRect(0, 0, W, H);

    drawStars();                                        // ★ 星空

    if (mazeCanvas) ctx.drawImage(mazeCanvas, 0, 0, W, H);

    drawDots();

    if (gameState === 'dying') {
      if (Math.floor(stateTimer * 12) % 2 === 0) drawPac();
    } else {
      drawPac();
    }

    if (gameState !== 'dying') {
      for (let i = 0; i < ghosts.length; i++) drawGhost(ghosts[i]);
    }
  }

  /* ============================================================
     9. HUD & 遮罩
     ============================================================ */
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovBtn   = document.getElementById('ovBtn');

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    let html = '';
    for (let i = 0; i < Math.max(0, lives); i++) html += '<i class="life"></i>';
    livesEl.innerHTML = html;
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  ovBtn.addEventListener('click', function () {
    if (gameState === 'paused') {
      gameState = 'playing';
      hideOverlay();
    } else {
      startGame();
    }
  });

  function togglePause() {
    if (gameState === 'playing') {
      gameState = 'paused';
      showOverlay('已暂停', '按空格或点击按钮继续', '继续游戏');
    } else if (gameState === 'paused') {
      gameState = 'playing';
      hideOverlay();
    }
  }

  /* ============================================================
     10. 输入
     ============================================================ */
  const KEYMAP = {
    arrowup:    { x: 0,  y: -1 },
    w:          { x: 0,  y: -1 },
    arrowdown:  { x: 0,  y: 1  },
    s:          { x: 0,  y: 1  },
    arrowleft:  { x: -1, y: 0  },
    a:          { x: -1, y: 0  },
    arrowright: { x: 1,  y: 0  },
    d:          { x: 1,  y: 0  }
  };

  window.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();

    if (KEYMAP[k]) {
      e.preventDefault();
      pac.nextDir = KEYMAP[k];
      return;
    }
    if (k === ' ' || k === 'spacebar') {
      e.preventDefault();
      togglePause();
    }
  }, { passive: false });

  let touchStart = null;

  canvas.addEventListener('touchstart', function (e) {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;

    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      pac.nextDir = { x: dx > 0 ? 1 : -1, y: 0 };
    } else {
      pac.nextDir = { x: 0, y: dy > 0 ? 1 : -1 };
    }
  }, { passive: true });

  /* ============================================================
     11. 主循环
     ============================================================ */
  let lastT = 0;

  function loop(t) {
    if (!lastT) lastT = t;
    let dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.06) dt = 0.06;
    if (dt < 0) dt = 0;

    animTime += dt;

    if (gameState === 'levelclear') {
      stateTimer -= dt;
      if (stateTimer <= 0) nextLevel();
    } else if (gameState !== 'paused') {
      update(dt);
    }

    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     12. 初始化
     ============================================================ */
  buildGrid();
  buildMazeCanvas();
  resetPositions();
  updateHUD();

  showOverlay('吃豆人', '吃掉所有豆子即可过关，小心幽灵！', '开始游戏');

  requestAnimationFrame(loop);

})();
</script>
